# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2

[licenses]
version = 2
# Only licenses a dependency actually uses: cargo-deny warns about unused
# entries, and a short list is easier to review when a new one appears.
# ISC, BSD-3-Clause and CDLA-Permissive-2.0 arrive with the stage-6 TLS stack
# (ring, untrusted, rustls-webpki; subtle; webpki-roots' certificate bundle):
# all permissive and compatible with MIT/Apache-2.0.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
