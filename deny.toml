# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2

[licenses]
version = 2
# Only licenses a dependency actually uses: cargo-deny warns about unused
# entries, and a short list is easier to review when a new one appears.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
