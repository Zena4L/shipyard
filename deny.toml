# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
ignore = [
  # Unmaintained (Astral ended it, 2026-11-03), not a vulnerability; no safe
  # upgrade. It comes only through `testcontainers` 0.28 (the newest), a
  # dev-dependency of the acceptance tests: never in what Shipyard ships.
  # Dropped once testcontainers moves off it (ROADMAP, Accepted at v1.0).
  { id = "RUSTSEC-2026-0440", reason = "dev-only, through testcontainers; unmaintained, not vulnerable" },
]

[licenses]
version = 2
# Only licenses a dependency actually uses: cargo-deny warns about unused
# entries, and a short list is easier to review when a new one appears.
# ISC, BSD-3-Clause and CDLA-Permissive-2.0 arrive with the stage-6 TLS stack
# (ring, untrusted, rustls-webpki; subtle; webpki-roots' certificate bundle):
# all permissive and compatible with Shipyard's own Apache-2.0.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The engine sits above the runtime (H1): only its front ends may depend on
# it, the CLI and the API (`shipyard-api`, stage 11's server), so
# the `shipyard-runtime` crate (and the image, network and storage crates)
# never do. The rule is per package: the `shipyard-runtime` *binary* is in
# `shipyard-cli`, so this allows it; it's a front end, like `shipyard`.
deny = [
  { crate = "shipyard-engine", wrappers = ["shipyard-cli", "shipyard-api"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
