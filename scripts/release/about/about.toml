# cargo-about's settings for a release's licence notices (step 15.6b3b,
# scripts/release/notices.sh). Accepted: the licences deny.toml and
# desktop/deny.toml allow (a crate under any other fails the notices, as it
# fails cargo deny). Only what's built into the binaries: no build or dev
# dependencies.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Zlib",
]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
