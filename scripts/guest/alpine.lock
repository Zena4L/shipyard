# The Alpine release the macOS guest is built from (step 10.3a), pinned.
# `build.sh` reads it. The minirootfs is checked against its sha256; the
# packages are installed at exactly these versions by the minirootfs's own
# apk, which checks each package's signature against the keys inside the
# (pinned) minirootfs. A version Alpine has dropped fails the build: re-pin
# here, then rebuild. Every package installed, dependencies too, is pinned by
# its identity in scripts/guest/alpine.installed (F92, step 13.8b): a build
# that installs anything else fails, saying what; after a re-pin here,
# `UPDATE_GUEST_LOCK=1 scripts/guest/build.sh` writes it again.
ALPINE_BRANCH=v3.24
ALPINE_RELEASE=3.24.2
MINIROOTFS=alpine-minirootfs-3.24.2-aarch64.tar.gz
MINIROOTFS_SHA256=9bf70a7f18ea44094cbb5f70c58f9af129c8214745743db0e68e5502cc2ce773
PACKAGES="e2fsprogs=1.47.4-r0"
# The kernel, from the same branch (KERNEL_BRANCH: another branch's, when
# the guest's own lags; same signing keys). F132's crashes aren't the
# version's: 6.12.114 crashed as 6.18.58 does, with several VMs at once
# (step 11.5a).
KERNEL_BRANCH=$ALPINE_BRANCH
KERNEL_PACKAGE="linux-virt=6.18.60-r0"
