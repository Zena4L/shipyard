[package]
name = "shipyard-cli"
description = "The `shipyard` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
# `cargo run` runs `shipyard`; the runtime needs `--bin shipyard-runtime`.
default-run = "shipyard"

# What both binaries share (internal, not an API).
[lib]
path = "src/lib.rs"

[[bin]]
name = "shipyard"
path = "src/main.rs"

# The OCI runtime command line (create, start, state, kill, delete, and the
# cgroup commands: pause, resume, update, ps, events).
[[bin]]
name = "shipyard-runtime"
path = "src/bin/shipyard-runtime/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Block device numbers for the I/O limit flags (`major`, `minor`).
libc.workspace = true
# `events --follow`'s polling.
nix = { workspace = true, features = ["poll"] }
# `--format`'s Go templates (step 11.3c).
gotmpl.workspace = true
# Docker's rows for `--format`, by their keys.
serde.workspace = true
serde_json.workspace = true
shipyard-api.workspace = true
shipyard-engine.workspace = true
# Parsing the network flags.
shipyard-network.workspace = true
shipyard-runtime.workspace = true
# The runtime binary's `--pid-file`, written whole.
shipyard-sys.workspace = true
# A run's `--volume`s, told apart (a bind's source or a named volume) on a Mac (step 10.3b).
shipyard-storage.workspace = true
shipyard-vm.workspace = true
# Docker's table columns.
tabwriter.workspace = true
# The env and label files' errors, by kind (`run/files.rs`).
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The API's archive stat header (tests/api.rs).
base64.workspace = true
clap-markdown.workspace = true
libc.workspace = true
# `hostname` for the isolation tests; `term` for the v0.1 milestone's
# pseudo-terminal (tests/image.rs).
nix = { workspace = true, features = ["hostname", "term"] }
proptest.workspace = true
shipyard-test-support.workspace = true
# `cp`'s tar streams (tests/runtime.rs).
tar.workspace = true

# Terminal (pseudo-terminal) tests. Not on libtest: the harness forks a fake
# shell that keeps running Rust code, which is only sound in a single-threaded
# process, and libtest runs tests on threads. See tests/terminal.rs.
[[test]]
name = "terminal"
path = "tests/terminal.rs"
harness = false

# A terminal through the macOS VM (step 10.3b2): the same fake shell,
# single-threaded for the same reason. See tests/vm_terminal.rs.
[[test]]
name = "vm_terminal"
path = "tests/vm_terminal.rs"
harness = false

[lints]
workspace = true
