[package]
name = "shipyard-cli"
description = "The `shipyard` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "shipyard"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
shipyard-runtime.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
clap-markdown.workspace = true
libc.workspace = true
# `term` for `openpty` in the terminal tests, `hostname` for the isolation tests.
nix = { workspace = true, features = ["hostname", "term"] }
proptest.workspace = true

# Terminal (pseudo-terminal) tests. Not on libtest: the harness forks a fake
# shell that keeps running Rust code, which is only sound in a single-threaded
# process, and libtest runs tests on threads. See tests/terminal.rs.
[[test]]
name = "terminal"
path = "tests/terminal.rs"
harness = false

[lints]
workspace = true
