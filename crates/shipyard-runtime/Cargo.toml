[package]
name = "shipyard-runtime"
description = "Low-level Linux container primitives: processes, namespaces, mounts, cgroups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
shipyard-test-support.workspace = true

# Containers and joining them, end to end (Linux; root). Not on libtest: the
# binary is also the container runtime its tests drive, and its `main` must
# call `init_entry_point` first. See tests/containers.rs.
[[test]]
name = "containers"
path = "tests/containers.rs"
harness = false

[lints]
workspace = true
