[package]
name = "shipyard-test-support"
description = "Helpers for Shipyard's end-to-end tests: running the binary, hostile parents, a fake shell on a pseudo-terminal. Dev-only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true
serde_json.workspace = true
# `term` for `openpty`; `sched` (a workspace feature) for network namespaces.
nix = { workspace = true, features = ["term"] }
# Interfaces for the network tests (an uplink, a container's eth0).
shipyard-network.workspace = true

[lints]
workspace = true
