[package]
name = "shipyard-engine"
description = "The container engine: what the CLI and, later, the API run on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Docker's credential form (`X-Registry-Auth`: image/given.rs).
base64.workspace = true
libc.workspace = true
# `sysconf(_SC_CLK_TCK)` for `top`'s and `stats`' clock ticks (`feature`).
# `ioctl`: the macOS guest's `FITRIM` at its stop (step 13.2).
nix = { workspace = true, features = ["feature", "ioctl"] }
serde.workspace = true
serde_json.workspace = true
# Networks' IDs, derived from what makes each one (step 11.2c2b).
sha2.workspace = true
shipyard-image.workspace = true
shipyard-network.workspace = true
shipyard-runtime.workspace = true
shipyard-storage.workspace = true
# Atomic writes, bounded reads, locks, inherited descriptors (stage 10).
shipyard-sys.workspace = true
tar.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
proptest.workspace = true
shipyard-test-support.workspace = true

[[test]]
name = "detached"
path = "tests/detached.rs"
harness = false

[lints]
workspace = true
