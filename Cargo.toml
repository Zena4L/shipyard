[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz targets build on nightly with cargo-fuzz, as their own workspace
# (docs/DEVELOPMENT.md).
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# Only the pinned toolchain (rust-toolchain.toml) is built and tested.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zena4L/shipyard"
authors = ["Clement Owireku-Bogyah"]
publish = false

[workspace.dependencies]
# Internal crates
shipyard-runtime = { path = "crates/shipyard-runtime" }
shipyard-test-support = { path = "crates/shipyard-test-support" }
# Stage 6: images and storage (the engine layer).
shipyard-image = { path = "crates/shipyard-image" }
shipyard-storage = { path = "crates/shipyard-storage" }
# Stage 7: networking (the engine layer).
shipyard-network = { path = "crates/shipyard-network" }
# Stage 8: the engine itself (H1), above the runtime.
shipyard-engine = { path = "crates/shipyard-engine" }
# Stage 10: the safe file plumbing every crate shares (D10.1-4).
shipyard-sys = { path = "crates/shipyard-sys" }
# Step 10.3: the macOS VM (D29).
shipyard-vm = { path = "crates/shipyard-vm" }

# External crates — versions are pinned here once and inherited by members.
anyhow = "1"
# Virtualization.framework from Rust (step 10.3, D29): the objc2 family,
# with only what the VM uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSString", "NSURL", "NSArray", "NSError", "NSFileHandle", "NSObject",
] }
objc2-virtualization = { version = "0.3", default-features = false, features = [
  "std", "block2", "dispatch2",
  "VZVirtualMachineConfiguration", "VZVirtualMachine",
  "VZBootLoader", "VZLinuxBootLoader",
  "VZPlatformConfiguration", "VZGenericPlatformConfiguration",
  "VZSerialPortConfiguration", "VZVirtioConsoleDeviceSerialPortConfiguration",
  "VZSerialPortAttachment", "VZFileHandleSerialPortAttachment",
  "VZEntropyDeviceConfiguration", "VZVirtioEntropyDeviceConfiguration",
  "VZSocketDeviceConfiguration", "VZVirtioSocketDeviceConfiguration",
  "VZSocketDevice", "VZVirtioSocketDevice", "VZVirtioSocketConnection",
  "VZStorageDeviceConfiguration", "VZVirtioBlockDeviceConfiguration",
  "VZStorageDeviceAttachment", "VZDiskImageStorageDeviceAttachment",
  "VZDirectorySharingDeviceConfiguration", "VZVirtioFileSystemDeviceConfiguration",
  "VZDirectoryShare", "VZSingleDirectoryShare", "VZSharedDirectory",
  "VZNetworkDeviceConfiguration", "VZVirtioNetworkDeviceConfiguration",
  "VZNetworkDeviceAttachment", "VZNATNetworkDeviceAttachment", "VZMACAddress",
] }
block2 = "0.6"
dispatch2 = "0.3"
# The VM's LaunchAgent (step 11.5b2a): a property list written, never by hand.
plist = { version = "1.10", default-features = false }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# Features are added as each stage needs them.
# Docker's `auth` credentials (base64 of `user:password`); ureq has it too.
base64 = "0.23"
nix = { version = "0.31", default-features = false, features = [
  "dir",
  "fs",
  "hostname",
  "mount",
  # Internet sockets (stage 7): holding a published port (`SockaddrIn`).
  "net",
  "poll",
  "process",
  "reboot",
  "resource",
  "sched",
  "signal",
  # Pseudo-terminals and their settings (stage 8): `openpty`.
  "term",
  # Netlink sockets (stage 7): `socket`, `bind`, `getsockname`, `sendto`,
  # `recvmsg` (with `uio`) and the receive timeout (with `time`).
  "socket",
  "time",
  "uio",
  "user",
] }
# `config.json` (OCI bundles) and the container init's setup description
# (stage 3). `std` has no JSON.
serde = { version = "1", features = ["derive"] }
# pidfds (stage 10, `shipyard-sys`), and a `recvmsg` that owns a truncated
# message's descriptors (F54): what nix lacks. Already locked through `tar`'s
# `xattr`.
rustix = { version = "1.1", default-features = false, features = ["std", "process", "net"] }
serde_json = "1"
# Go templates for `--format` (step 11.3c, D11.3c-1): MIT, no `unsafe`,
# bounded execution, sorted maps, values from serde. Pinned exactly: one
# author and pre-1.0, so an update is read before it's taken.
gotmpl = { version = "=0.6.1", default-features = false, features = ["std", "serde"] }
# Docker's table columns (Go's `text/tabwriter`, ported).
tabwriter = "1.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Stage 6 (images and storage). Decisions are recorded in
# docs/stages/06-images-plan.md. No async runtime (blocking I/O + a thread
# pool until stage 11's API needs async).
#
# Registry client: ureq is blocking and bundles rustls (no OpenSSL system
# dependency). rustls' crypto provider (ring) is C/asm, not pure Rust — the
# one exception to the pure-Rust preference, accepted because rustls has no
# pure-Rust provider today; its licenses (Apache-2.0, ISC) are allowed in
# deny.toml. `platform-verifier`: certificates are checked against the
# operating system's trust store, as Docker and Podman do (so a private CA
# installed on the host works). No `gzip`: ureq would otherwise decompress a
# blob a CDN labels `Content-Encoding: gzip`, and its digest would fail.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# Content addressing and blob verification are sha256.
sha2 = "0.11"
# Layer decompression. The default miniz_oxide backend is pure Rust; gzip is
# the near-universal layer format. (zstd is added as a later, feature-gated
# step: it wraps a C library.)
flate2 = "1"
# Reading layer tar streams. Used for parsing only — never its `unpack`:
# extraction is done by Shipyard under the stage-6 safety invariants.
tar = "0.4"

# Stage 11: the Docker Engine API (step 11.2, D11-1). hyper's HTTP/1.1 server
# on a current-thread tokio runtime over a UNIX socket; the engine stays
# blocking, its calls on tokio's blocking pool. Only what the server uses.
tokio = { version = "1", default-features = false, features = [
  "rt", "net", "time", "sync", "io-util",
] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# `%XX` in the API's paths and queries (step 11.2a).
percent-encoding = "2"
# Acceptance tests only (step 11.4b1): Testcontainers for Rust against the
# API's UNIX socket; no crypto provider (its default `ring` feature off),
# though bollard's buildkit client (tonic, prost) and rustls come with it.
testcontainers = { version = "=0.28.0", default-features = false }
shipyard-api = { path = "crates/shipyard-api" }

# Test-only crates.
clap-markdown = "0.1"
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Every public item is documented; `cargo doc` output is part of the product.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# cargo-fuzz builds with `--cfg fuzzing`, which opens `shipyard-image`'s
# entry points for the fuzz targets.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every `unsafe` block must explain why it is sound.
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"
# POSIX names (uid/gid, pid/pgid, euid/egid) are clearer than invented ones.
similar_names = "allow"
missing_errors_doc = "allow"
# No unwrap/expect outside tests (see clippy.toml); return errors instead.
unwrap_used = "warn"
expect_used = "warn"
# Every `#[allow]` says why (`reason = "…"`), so it can be judged later.
allow_attributes_without_reason = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
