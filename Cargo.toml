[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# Only the pinned toolchain (rust-toolchain.toml) is built and tested.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zena4L/shipyard"
authors = ["Clement Owireku-Bogyah"]
publish = false

[workspace.dependencies]
# Internal crates
shipyard-runtime = { path = "crates/shipyard-runtime" }
shipyard-test-support = { path = "crates/shipyard-test-support" }

# External crates — versions are pinned here once and inherited by members.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# Features are added as each stage needs them.
nix = { version = "0.31", default-features = false, features = [
  "fs",
  "poll",
  "process",
  "resource",
  "sched",
  "signal",
  "user",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Test-only crates.
clap-markdown = "0.1"
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Every public item is documented; `cargo doc` output is part of the product.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every `unsafe` block must explain why it is sound.
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"
# POSIX names (uid/gid, pid/pgid, euid/egid) are clearer than invented ones.
similar_names = "allow"
missing_errors_doc = "allow"
# No unwrap/expect outside tests (see clippy.toml); return errors instead.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
