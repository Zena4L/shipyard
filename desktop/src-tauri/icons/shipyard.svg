<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Shipyard's app icon (step 14.7): the rail's brand mark (docs/design's
       crane rail, hook and container, a 24-unit grid) on the design's navy (Cobalt Yard, before stage 15),
       in Apple's icon grid (an 824-px rounded square, 100 px in).
       Its sizes: rendered to a 1024-px (or larger) PNG, then
       `npm run tauri -- icon PNG --output src-tauri/icons` in desktop/ui,
       keeping the files tauri.conf.json names. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14245a"/>
      <stop offset="1" stop-color="#070d22"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(176 176) scale(28)">
    <rect x="1" y="3" width="22" height="3" fill="#5b7bff"/>
    <rect x="15" y="6" width="2" height="6" fill="#5b7bff"/>
    <rect x="3" y="13" width="18" height="9" rx="1" fill="#33509c"/>
    <path d="M7 14.5v6M10 14.5v6M13 14.5v6M16 14.5v6" stroke="#e9eefa" stroke-opacity=".45" stroke-width="1"/>
  </g>
</svg>
