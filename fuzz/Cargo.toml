# Fuzz targets for what Shipyard reads from untrusted sources: registries'
# documents and headers, image references, layer archives, what the kernel
# sends over netlink, `-p`, and containers' logs. Built on
# nightly with cargo-fuzz, outside the main workspace; run them with
# `scripts/test-linux.sh --fuzz` (docs/DEVELOPMENT.md).
[package]
name = "shipyard-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shipyard-image = { path = "../crates/shipyard-image" }
shipyard-network = { path = "../crates/shipyard-network" }
shipyard-runtime = { path = "../crates/shipyard-runtime" }
shipyard-engine = { path = "../crates/shipyard-engine" }
shipyard-api = { path = "../crates/shipyard-api" }

# Its own workspace: not one of Shipyard's crates.
[workspace]

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

