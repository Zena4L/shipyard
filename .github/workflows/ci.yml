name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

# A new push to the same PR branch cancels the run it supersedes. Runs on main
# are never cancelled, so every commit there gets a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The Rust version comes from rust-toolchain.toml alone: rustup (preinstalled on
# GitHub runners) installs it, with clippy, rustfmt and the Linux targets, on
# the first cargo command. `--locked` fails the build if Cargo.lock is stale.
#
# Every action is pinned by commit (its version beside it): a tag can be moved to
# other code, a commit can't.
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo fmt --all --check

  # Both platforms: each compiles code and tests the other one never sees.
  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung supervisor test must fail the job, not hold a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Rootless containers (stage 4) run as this normal user. Here they run
      # the binaries cargo built (in target/), which Shipyard's AppArmor
      # profile doesn't attach to, so Ubuntu's restriction on user namespaces
      # (since 23.10) is turned off; the `apparmor` job below tests with it on.
      - name: allow rootless containers
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          scripts/ci/rootless-setup.sh
      - run: cargo clippy --locked --workspace --all-targets
      - name: cargo test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            systemd-run --user --scope --quiet cargo test --locked --workspace
          else
            cargo test --locked --workspace
          fi
        env:
          # Set up above: here a skipped rootless test, or a run without a
          # delegated cgroup, is a failure.
          SHIPYARD_TEST_ROOTLESS: ${{ runner.os == 'Linux' && 'required' || '' }}
          SHIPYARD_TEST_DELEGATED: ${{ runner.os == 'Linux' && 'required' || '' }}

  # Tests that need root (switching user and groups, namespaces, root
  # filesystems, the OCI runtime, cgroups, device programs) are #[ignore]d in
  # normal runs. Here they run as root through a cargo runner, so cargo itself
  # (and the build) never does. Both platforms: Linux and macOS switch
  # credentials differently (setresuid vs setuid, and macOS's group list
  # layout).
  root:
    name: test as root (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # On Linux, each test binary runs in a network namespace of its
          # own (scripts/ci-netns.sh): as root, `shipyard run` makes a bridge,
          # firewall rules and turns on forwarding, never on the runner.
          - os: ubuntu-latest
            runner_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER
            runner: ci-netns
          - os: macos-latest
            runner_var: CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER
            runner: sudo -E
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          runner="${{ matrix.runner }}"
          [ "$runner" = ci-netns ] && runner="$GITHUB_WORKSPACE/scripts/ci-netns.sh"
          echo "${{ matrix.runner_var }}=$runner" >> "$GITHUB_ENV"
      # What the container tests rely on, in the log: the root-filesystem
      # fixtures copy host programs with the libraries `ldd` lists, and the
      # mount tests want `/` shared (as on a systemd host) to catch leaks.
      # The pasta tests run shipyard as the runner's user (SUDO_UID) from
      # root: pasta for it, and rootless user namespaces allowed.
      # nft (nftables) only for the firewall tests to look with, and to make
      # another program's chains: Shipyard never runs it. nft, ip and dig are
      # also the references Shipyard's own nf_tables, netlink and DNS server
      # are tested against (H5).
      - name: pasta, for rootless networking; nft and dig, for the tests
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq passt uidmap nftables bind9-dnsutils
      - name: host facts for the container tests
        if: runner.os == 'Linux'
        run: |
          uname -r
          ldd --version | head -1
          findmnt -no PROPAGATION /
      # The terminal tests first, on their own (temporary, to diagnose): a
      # step's own time limit fails it before the job's, so its log is kept.
      - name: terminal tests, on their own
        if: runner.os == 'Linux'
        timeout-minutes: 5
        continue-on-error: true
        run: cargo test --locked -p shipyard-cli --test terminal -- --include-ignored
      - run: cargo test --locked --workspace -- --include-ignored
        timeout-minutes: 12
        env:
          # ip, nft and dig are installed above: the differential tests
          # (H5) must run, not skip.
          SHIPYARD_TEST_TOOLS: required
      # Diagnostics (temporary): what pasta and AppArmor said, kept even when
      # a test step fails or times out.
      - name: diagnostics (pasta, AppArmor denials)
        if: always() && runner.os == 'Linux'
        run: |
          uname -rm
          pasta --version 2>&1 | head -1 || true
          ls -l /etc/apparmor.d/ | grep -iE 'pasta|passt|shipyard' || true
          sudo aa-status 2>/dev/null | grep -iE 'pasta|passt|shipyard' || true
          sudo journalctl -k --no-pager 2>/dev/null | grep -iE 'apparmor="DENIED"' | tail -60 || true

  # A real host (H4): Ubuntu as users have it, the AppArmor restriction on
  # user namespaces left on, and Shipyard installed in /usr/local/bin with
  # its profile, as docs/user/README.md says. The end-to-end tests run the
  # installed binaries (SHIPYARD_TEST_BIN_DIR). A control proves the profile
  # is what lets them through.
  apparmor:
    name: rootless (Ubuntu, AppArmor on)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: the restriction is on, as it is on users' machines
        run: test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - run: scripts/ci/rootless-setup.sh
      - run: cargo build --locked --bins
      - name: install shipyard and its AppArmor profile, as a user would
        run: |
          sudo install -m 0755 target/debug/shipyard target/debug/shipyard-runtime /usr/local/bin/
          sudo install -m 0644 contrib/apparmor/shipyard /etc/apparmor.d/shipyard
          sudo apparmor_parser -r /etc/apparmor.d/shipyard
      - name: the profile is what lets it make user namespaces (control)
        run: scripts/ci/apparmor-control.sh
      # shipyard-cli's tests: the end-to-end ones run the installed binaries.
      # (The runtime's in-process tests make user namespaces from their own
      # test binary, which no profile covers: they run in `check`.)
      # The terminal tests first, on their own (temporary, to diagnose): a
      # step's own time limit fails it before the job's, so its log is kept.
      - name: terminal tests, on their own, against the installed binaries
        timeout-minutes: 6
        continue-on-error: true
        run: systemd-run --user --scope --quiet cargo test --locked -p shipyard-cli --test terminal
        env:
          SHIPYARD_TEST_BIN_DIR: /usr/local/bin
          SHIPYARD_TEST_ROOTLESS: required
          SHIPYARD_TEST_DELEGATED: required
      - name: cargo test, against the installed binaries
        timeout-minutes: 15
        run: systemd-run --user --scope --quiet cargo test --locked -p shipyard-cli
        env:
          SHIPYARD_TEST_BIN_DIR: /usr/local/bin
          SHIPYARD_TEST_ROOTLESS: required
          SHIPYARD_TEST_DELEGATED: required
      # Diagnostics (temporary): what pasta and AppArmor said, kept even when
      # a test step fails or times out.
      - name: diagnostics (pasta, AppArmor denials)
        if: always()
        run: |
          uname -rm
          pasta --version 2>&1 | head -1 || true
          ls -l /etc/apparmor.d/ | grep -iE 'pasta|passt|shipyard' || true
          sudo aa-status 2>/dev/null | grep -iE 'pasta|passt|shipyard' || true
          sudo journalctl -k --no-pager 2>/dev/null | grep -iE 'apparmor="DENIED"' | tail -60 || true

  # Another real host (H4): Fedora, SELinux enforcing, in a QEMU/KVM VM on
  # the runner. Both passes (rootless, then root), from executables built
  # here. firewalld is stopped until stage 8.6 (F14).
  fedora:
    name: Fedora VM (SELinux enforcing)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/shipyard-vm
          # The image is pinned in the script: a new pin, a new cache.
          key: fedora-cloud-${{ hashFiles('scripts/ci/fedora-vm.sh') }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      - run: scripts/ci/fedora-vm.sh

  # musl (static, Alpine-style builds) has different libc types and wrappers;
  # make sure the code compiles there too.
  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: rustup target add x86_64-unknown-linux-musl
      # rustls' crypto provider, ring, compiles C, and for a musl target its
      # build looks for `musl-gcc`.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo clippy --locked --workspace --all-targets --target x86_64-unknown-linux-musl

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Broken intra-doc links and malformed doc comments fail the build.
      - run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
