name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

# A new push to the same PR branch cancels the run it supersedes. Runs on main
# are never cancelled, so every commit there gets a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The Rust version comes from rust-toolchain.toml alone: rustup (preinstalled on
# GitHub runners) installs it, with clippy, rustfmt and the Linux targets, on
# the first cargo command. `--locked` fails the build if Cargo.lock is stale.
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  # Both platforms: each compiles code and tests the other one never sees.
  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung supervisor test must fail the job, not hold a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace

  # Tests that need root (switching user and groups) are #[ignore]d in normal
  # runs. Here they run as root through a cargo runner, so cargo itself (and
  # the build) never does.
  root:
    name: test as root (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace -- --include-ignored

  # musl (static, Alpine-style builds) has different libc types and wrappers;
  # make sure the code compiles there too.
  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo clippy --locked --workspace --all-targets --target x86_64-unknown-linux-musl

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and malformed doc comments fail the build.
      - run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
