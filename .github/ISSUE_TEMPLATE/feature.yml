name: Feature request
description: Something Shipyard should do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The task, not the solution. A Docker command or compose file you'd like to work is a good start.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you'd like it to work
